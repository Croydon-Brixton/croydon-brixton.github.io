<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The mark is near-black and vanishes on a dark browser tab strip. An SVG
       favicon can carry its own media query, so invert it there. Chrome and
       Firefox honour this; Safari falls back to the PNG. -->
  <style>
    @media (prefers-color-scheme: dark) { image { filter: invert(1); } }
  </style>
  <image width="128" height="128" href="data:image/png;base64,"/>
</svg>
